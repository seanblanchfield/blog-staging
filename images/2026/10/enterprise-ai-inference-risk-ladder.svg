<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Where Should Your AI Inference Run?</title>
  <desc id="desc">Five AI hosting levels ordered from personal AI lab accounts, which should be eliminated for company data, through enterprise AI lab inference, hyperscaler-hosted proprietary models, independent open-weight hosting, and owner-controlled open-weight models.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="1" stop-color="#171d28"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect x="0" y="0" width="18" height="1200" fill="#f35b5b"/>

  <text id="title-text" x="90" y="105" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="58" font-weight="700">Where Should Your AI Inference Run?</text>
  <text x="92" y="160" fill="#b7c1d1" font-family="DejaVu Sans, Arial, sans-serif" font-size="27">Five hosting levels ranked by data-training and control risk</text>

  <text x="92" y="221" fill="#f69292" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">MORE RELIANCE ON PROVIDER TRUST · LESS CONTROL</text>
  <line x1="92" y1="238" x2="1510" y2="238" stroke="#394354" stroke-width="2"/>

  <!-- Row 1 -->
  <g>
    <rect x="90" y="270" width="1420" height="148" rx="18" fill="#24202a" stroke="#f35b5b" stroke-width="3"/>
    <rect x="90" y="270" width="14" height="148" rx="7" fill="#f35b5b"/>
  </g>
  <rect x="130" y="301" width="218" height="42" rx="21" fill="#7c2930"/>
  <text x="239" y="329" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1">OUTSIDE PERIMETER</text>
  <text x="130" y="382" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700">Personal AI lab accounts</text>
  <text x="565" y="324" fill="#ff8585" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700">ELIMINATE FOR COMPANY DATA</text>
  <text x="565" y="362" fill="#d7dce5" font-family="DejaVu Sans, Arial, sans-serif" font-size="22">No company contract, visibility, retention control or deletion rights.</text>
  <text x="565" y="394" fill="#9faabc" font-family="DejaVu Sans, Arial, sans-serif" font-size="20">Shadow AI sits outside the governed data perimeter.</text>

  <!-- Row 2 -->
  <g>
    <rect x="90" y="442" width="1420" height="148" rx="18" fill="#202630" stroke="#ef8b50" stroke-width="2"/>
    <rect x="90" y="442" width="14" height="148" rx="7" fill="#ef8b50"/>
  </g>
  <rect x="130" y="473" width="256" height="42" rx="21" fill="#673e2b"/>
  <text x="258" y="501" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1">TIER 4 · LEAST SENSITIVE</text>
  <text x="130" y="554" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700">Enterprise AI lab inference</text>
  <text x="640" y="495" fill="#ffd1b0" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700">Direct enterprise access</text>
  <text x="640" y="534" fill="#d7dce5" font-family="DejaVu Sans, Arial, sans-serif" font-size="22">No-training terms and admin controls, but the lab owns the model</text>
  <text x="640" y="566" fill="#9faabc" font-family="DejaVu Sans, Arial, sans-serif" font-size="20">and infrastructure. Use only for least-sensitive workloads.</text>

  <!-- Row 3 -->
  <g>
    <rect x="90" y="614" width="1420" height="148" rx="18" fill="#202630" stroke="#e4bf53" stroke-width="2"/>
    <rect x="90" y="614" width="14" height="148" rx="7" fill="#e4bf53"/>
  </g>
  <rect x="130" y="645" width="205" height="42" rx="21" fill="#615329"/>
  <text x="232" y="673" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1">TIER 3 · SENSITIVE</text>
  <text x="130" y="726" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700">Proprietary models via hyperscalers</text>
  <text x="730" y="667" fill="#fae5a0" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700">AWS, Azure and peers</text>
  <text x="730" y="706" fill="#d7dce5" font-family="DejaVu Sans, Arial, sans-serif" font-size="22">More separation from the AI lab, but ownership, code and commercial</text>
  <text x="730" y="738" fill="#9faabc" font-family="DejaVu Sans, Arial, sans-serif" font-size="20">relationships remain entangled. Suitable for sensitive workloads.</text>

  <!-- Row 4 -->
  <g>
    <rect x="90" y="786" width="1420" height="148" rx="18" fill="#202630" stroke="#55bd91" stroke-width="2"/>
    <rect x="90" y="786" width="14" height="148" rx="7" fill="#55bd91"/>
  </g>
  <rect x="130" y="817" width="270" height="42" rx="21" fill="#285a48"/>
  <text x="265" y="845" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1">TIER 2 · HIGHLY SENSITIVE</text>
  <text x="130" y="898" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700">Open-weight models on independent hosts</text>
  <text x="790" y="839" fill="#a9e8ce" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700">Independent infrastructure</text>
  <text x="790" y="878" fill="#d7dce5" font-family="DejaVu Sans, Arial, sans-serif" font-size="22">The host does not own the model and can offer contractual, technical</text>
  <text x="790" y="910" fill="#9faabc" font-family="DejaVu Sans, Arial, sans-serif" font-size="20">and physical separation. Suitable for highly sensitive workloads.</text>

  <!-- Row 5 -->
  <g>
    <rect x="90" y="958" width="1420" height="148" rx="18" fill="#202630" stroke="#4fa9e8" stroke-width="2"/>
    <rect x="90" y="958" width="14" height="148" rx="7" fill="#4fa9e8"/>
  </g>
  <rect x="130" y="989" width="272" height="42" rx="21" fill="#285775"/>
  <text x="266" y="1017" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1">TIER 1 · MOST SENSITIVE</text>
  <text x="130" y="1070" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700">Open-weight models on owner hardware</text>
  <text x="760" y="1011" fill="#b1ddfa" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700">Maximum organisational control</text>
  <text x="760" y="1050" fill="#d7dce5" font-family="DejaVu Sans, Arial, sans-serif" font-size="22">You control data, network, logging and retention — and carry the</text>
  <text x="760" y="1082" fill="#9faabc" font-family="DejaVu Sans, Arial, sans-serif" font-size="20">operational burden. Reserve for the most sensitive workloads.</text>

  <text x="92" y="1160" fill="#92c7ec" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">LESS RELIANCE ON PROVIDER TRUST · MORE CONTROL</text>
  <text x="1510" y="1160" text-anchor="end" fill="#7f8999" font-family="DejaVu Sans, Arial, sans-serif" font-size="18">seanblanchfield.com</text>
</svg>
